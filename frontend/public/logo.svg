<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sonicWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00f2fe" />
      <stop offset="50%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#06b6d4" stroke-opacity="0.3" />

  <!-- Audio Wave Bars -->
  <rect x="10" y="24" width="5" height="16" rx="2.5" fill="url(#sonicWaveGrad)" opacity="0.65" />
  <rect x="19" y="16" width="5" height="32" rx="2.5" fill="url(#sonicWaveGrad)" opacity="0.85" />
  <rect x="29.5" y="8" width="5" height="48" rx="2.5" fill="url(#sonicWaveGrad)" filter="url(#glow)" />
  <rect x="40" y="14" width="5" height="36" rx="2.5" fill="url(#sonicWaveGrad)" opacity="0.85" />
  <rect x="49" y="22" width="5" height="20" rx="2.5" fill="url(#sonicWaveGrad)" opacity="0.65" />

  <!-- Neural Orbital Path -->
  <path
    d="M 12 32 C 12 44, 52 44, 52 32 C 52 20, 12 20, 12 32"
    stroke="url(#sonicWaveGrad)"
    stroke-width="2"
    stroke-dasharray="3 4"
    stroke-linecap="round"
    opacity="0.5"
  />
</svg>
